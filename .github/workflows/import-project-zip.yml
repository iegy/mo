name: Import MO project ZIP

on:
  push:
    branches: [main]
    paths:
      - 'MO_CHAPTER_01_COMPLETE_v1.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project package into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP='MO_CHAPTER_01_COMPLETE_v1.zip'
          test -f "$ZIP"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          SRC="$TMP/MO_CHAPTER_01_COMPLETE_v1.0"
          if [ ! -d "$SRC" ]; then
            SRC="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          fi
          test -n "$SRC" && test -d "$SRC"
          rsync -a --delete "$SRC/" ./ \
            --exclude '.git/' \
            --exclude 'MO_CHAPTER_01_COMPLETE_v1.zip' \
            --exclude '.github/workflows/import-project-zip.yml'
          rm -f "$ZIP"
          rm -f .github/workflows/import-project-zip.yml

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import MO Chapter 01 production project'
          git push origin main

      - name: Start GitHub Pages production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if gh workflow run deploy-pages.yml --repo "${{ github.repository }}" --ref main; then
              echo 'Deployment workflow started.'
              exit 0
            fi
            sleep 3
          done
          echo 'Project imported successfully, but deployment dispatch could not be started automatically.'
          echo 'Run deploy-pages.yml manually from the Actions tab.'
